<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: rgba(4, 10, 14, 0.9);
    --cyan: #2de3ff;
    --amber: #ffb648;
    --panel-line: rgba(45, 227, 255, 0.35);
    --text: #d8f6ff;
    --text-dim: #5f8b98;
  }
  html, body {
    margin: 0;
    background: transparent;
    font-family: "Rajdhani", sans-serif;
    overflow: hidden;
    height: 100vh;
    -webkit-app-region: drag;
  }
  #frame {
    position: relative;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-line);
    box-shadow: 0 0 20px rgba(45, 227, 255, 0.15), inset 0 0 30px rgba(45, 227, 255, 0.03);
  }
  #frame::before, #frame::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid var(--cyan);
    opacity: 0.85;
    pointer-events: none;
    z-index: 2;
  }
  #frame::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  #frame::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .header {
    -webkit-app-region: drag;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--panel-line);
    flex-shrink: 0;
  }
  .title {
    font-family: "Orbitron", sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--cyan);
    text-shadow: 0 0 6px rgba(45, 227, 255, 0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .close-btn {
    -webkit-app-region: no-drag;
    padding: 3px 9px;
    font-size: 10px;
    font-family: "Rajdhani", sans-serif;
    font-weight: 600;
    background: rgba(45, 227, 255, 0.05);
    border: 1px solid var(--panel-line);
    color: var(--text);
    cursor: pointer;
    clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
  }
  .close-btn:hover { border-color: #ff5c5c; color: #ff5c5c; background: rgba(255, 92, 92, 0.1); }

  .code-area {
    -webkit-app-region: no-drag;
    flex: 1;
    overflow-y: auto;
    padding: 10px 0;
    font-family: "Roboto Mono", monospace;
    font-size: 12px;
  }
  .code-line { display: flex; padding: 1px 12px; }
  .code-line.flagged { background: rgba(255, 182, 72, 0.12); border-left: 2px solid var(--amber); }
  .line-num { color: var(--text-dim); width: 32px; flex-shrink: 0; text-align: right; margin-right: 12px; user-select: none; }
  .line-text { color: var(--text); white-space: pre; }
  .code-line.flagged .line-text { color: var(--amber); }

  .explanation {
    -webkit-app-region: no-drag;
    flex-shrink: 0;
    max-height: 100px;
    overflow-y: auto;
    padding: 10px 12px;
    border-top: 1px solid var(--panel-line);
    background: rgba(0, 0, 0, 0.25);
    font-size: 13px;
    line-height: 1.4;
    color: var(--text);
  }
  .explanation-label {
    font-family: "Orbitron", sans-serif;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--amber);
    margin-bottom: 4px;
  }
</style>
</head>
<body>
  <div id="frame">
    <div class="header">
      <div class="title" id="file-title">CODE REVIEW</div>
      <button class="close-btn" id="close-btn">✕</button>
    </div>
    <div class="code-area" id="code-area"></div>
    <div class="explanation">
      <div class="explanation-label">VESPER SAYS</div>
      <div id="explanation-text"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let data = {};
    try {
      data = JSON.parse(params.get("data") || "{}");
    } catch (e) {
      data = {};
    }

    document.getElementById("file-title").textContent = (data.filename || "CODE REVIEW").toUpperCase();
    document.getElementById("explanation-text").textContent = data.explanation || "";

    const flaggedSet = new Set(data.flagged_lines || []);
    const codeArea = document.getElementById("code-area");
    const lines = (data.content || "").split("\n");

    lines.forEach((lineText, idx) => {
      const lineNum = idx + 1;
      const row = document.createElement("div");
      row.className = "code-line" + (flaggedSet.has(lineNum) ? " flagged" : "");

      const numEl = document.createElement("div");
      numEl.className = "line-num";
      numEl.textContent = lineNum;

      const textEl = document.createElement("div");
      textEl.className = "line-text";
      textEl.textContent = lineText;

      row.appendChild(numEl);
      row.appendChild(textEl);
      codeArea.appendChild(row);
    });

    // Scroll to the first flagged line, if any, so it's immediately visible
    // instead of the user having to scroll through the whole file.
    const firstFlagged = codeArea.querySelector(".code-line.flagged");
    if (firstFlagged) firstFlagged.scrollIntoView({ block: "center" });

    document.getElementById("close-btn").addEventListener("click", () => {
      window.codeBoxAPI?.close?.();
    });
  </script>
</body>
</html>
